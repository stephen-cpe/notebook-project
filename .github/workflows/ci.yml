name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Mypy type check
        run: mypy src/

      - name: Pytest with coverage
        run: pytest tests/ --cov=src --cov-fail-under=80 -q
        env:
          CI: "true"
          AI_MOCK: "true"
          SECRET_KEY: "ci-test-secret"
          # Voice tests that need the blueprint register with VOICE_ENABLED=true
          # set it per-test; keep the default off here so non-voice tests stay
          # unaffected.
          VOICE_ENABLED: "false"
