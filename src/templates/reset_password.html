{% extends "base.html" %}
{% block title %}Reset Password · notebook-project{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card bg-body-tertiary border-secondary">
      <div class="card-body p-4">
        <h3 class="card-title mb-4">Reset Your Password</h3>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="new_password" class="form-label">New Password</label>
            <input type="password" class="form-control form-control-lg" id="new_password"
                   name="new_password" placeholder="Enter new password" minlength="6" required>
            <div class="form-text">Must be at least 6 characters.</div>
          </div>
          <button type="submit" class="btn btn-info w-100">Update Password</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('notebooks.list_notebooks') }}" class="btn btn-outline-secondary btn-sm">Back to Notebooks</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
